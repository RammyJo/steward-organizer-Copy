/* Manual priority ordering */
.priority-list{display:flex;flex-direction:column;gap:8px}
.nav-btn[data-page="priorities"],.nav-btn[data-page="accomplishments"]{display:none!important}
.priority-item{display:grid;grid-template-columns:42px 30px minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:13px 14px;background:var(--surface);border:1px solid var(--border);border-radius:10px;min-width:0;transition:border-color var(--ease),background var(--ease),transform var(--ease)}
.priority-item:hover{border-color:var(--border-strong)}
.priority-item.priority-drop-before{box-shadow:inset 0 3px 0 var(--primary)}
.priority-item.priority-drop-after{box-shadow:inset 0 -3px 0 var(--primary)}
.priority-item.priority-is-dragging{opacity:.45;border-style:dashed}
.priority-rank{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.priority-rank span{font-size:9px;text-transform:uppercase;letter-spacing:.6px;font-weight:500;color:var(--muted-2)}
.priority-grip{display:grid;place-items:center;width:30px;height:36px;border:1px solid transparent;border-radius:7px;background:transparent;color:var(--muted);font-size:23px;line-height:1;cursor:grab;touch-action:none;user-select:none}
.priority-grip:hover,.priority-grip:focus-visible{background:var(--surface-2);border-color:var(--border);color:var(--text)}
.priority-grip:active{cursor:grabbing}
.priority-main{min-width:0}
.priority-task-name{font-size:13px;font-weight:650;color:var(--text);overflow-wrap:anywhere}
.priority-task-meta{display:flex;gap:7px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-top:5px}
.priority-side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.priority-actions{display:flex;gap:4px;align-items:center}
.priority-move{width:30px;height:30px;padding:0;display:grid;place-items:center;border:1px solid var(--border);border-radius:7px;background:var(--surface-2);color:var(--muted);font-size:15px}
.priority-move:hover:not(:disabled){color:var(--text);border-color:var(--border-strong)}
.priority-move:disabled{opacity:.28;cursor:not-allowed}
.priority-helper{display:flex;align-items:flex-start;gap:10px;padding:13px 15px;border:1px solid var(--border);border-radius:9px;background:var(--surface-2);color:var(--muted);font-size:12px;line-height:1.5;margin-bottom:15px}
.priority-helper strong{color:var(--text)}
@media(max-width:900px){.priority-item{grid-template-columns:34px 28px minmax(0,1fr) auto;gap:8px;padding:11px}.priority-side{grid-column:3;flex-direction:row;align-items:center;justify-content:flex-start;flex-wrap:wrap}.priority-actions{grid-column:4;grid-row:1 / span 2}.priority-task-meta{font-size:10px}}
@media(max-width:540px){.priority-item{grid-template-columns:29px 25px minmax(0,1fr) 62px;gap:6px;padding:9px}.priority-grip{width:25px}.priority-rank{font-size:13px}.priority-task-name{font-size:12px}.priority-side{gap:4px}.priority-side .pill{font-size:9px;padding:3px 5px}.priority-actions{flex-direction:column}.priority-move{width:27px;height:26px}}

.task-category-tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;margin:0 0 12px;border-bottom:1px solid var(--line);scrollbar-width:thin}
.task-category-tab{display:inline-flex;align-items:center;gap:9px;white-space:nowrap;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:10px;padding:10px 12px;font:inherit;font-size:12px;cursor:pointer}
.task-category-tab:hover{border-color:var(--accent);color:var(--text)}
.task-category-tab.active{background:var(--accent-soft);border-color:var(--accent);color:var(--text);font-weight:650}
.task-category-count{display:inline-flex;min-width:22px;height:21px;align-items:center;justify-content:center;padding:0 5px;border-radius:6px;background:var(--surface);font-size:10px;font-weight:700;color:var(--muted)}
.task-category-tab.active .task-category-count{background:var(--accent);color:white}
.task-count-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:0 0 18px}
.task-count-summary>div{display:flex;flex-direction:column;gap:5px;padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.task-count-label{font-size:11px;color:var(--muted)}
.task-count-summary strong{font-size:23px;line-height:1.15;font-weight:700}
@media(max-width:700px){.task-count-summary{grid-template-columns:repeat(2,minmax(0,1fr))}.task-category-tab{padding:9px 10px}}
</style>
</head>

const SEED_VERSION=2;function loadState(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const s=JSON.parse(raw);if(s&&Array.isArray(s.tasks)&&Array.isArray(s.projects)){if(s.seedVersion!==SEED_VERSION){const done=s.tasks.filter(t=>['Completed','Cancelled'].includes(t.status));const keep=new Set(done.map(t=>t.id));s.tasks=done.concat(deepCopy(seedTasks));s.projects=deepCopy(seedProjects);s.projects.forEach(pr=>{pr.tasks=((pr.tasks||[]).filter(id=>keep.has(id)));});let mx=301;done.forEach(t=>{const n=parseInt(String(t.id||'').slice(2),10);if(Number.isFinite(n)&&n>mx)mx=n;});s.nextTask=Math.max(s.nextTask||0,mx+1);s.seedVersion=SEED_VERSION;try{localStorage.setItem(STORAGE_KEY,JSON.stringify(s))}catch(e){}}return s}}}catch(e){}return {tasks:deepCopy(seedTasks),projects:deepCopy(seedProjects),ideas:deepCopy(seedIdeas),inbox:[],activity:deepCopy(seedActivity),theme:'dark',nextTask:302,nextProject:106,nextIdea:105,seedVersion:SEED_VERSION}}

function initials(name){if(!name||name==='Unassigned')return '—';return name.split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0].toUpperCase()).join('')}
function statusClass(status){const map={'Needs review':'status-review','Blocked':'status-blocked','In progress':'status-progress','Ready':'status-ready','Completed':'status-completed','Proposed':'status-proposed','On hold':'status-hold','Cancelled':'status-cancelled'};return map[status]||'status-proposed'}

function getTask(id){return state.tasks.find(t=>t.id===id)}
function sectionFor(t){
  const owner=String(t.owner||'').trim();
  if(!owner||owner==='Unassigned')return 'Unassigned';
  const hay=((t.title||'')+' '+String(t.description||'')).toLowerCase();
  const has=(...words)=>words.some(w=>hay.includes(w));
  if(has('worship','prayer','bible','disciple','ministry','fellowship','devotion','g12','vbs','easter','youth','kids','evangel','sermon','choir','usher','volunteer','outreach','cell group','baptism','communion','pastor','retreat','camp','revival','discipleship','sunday','sunday school','devotional','teaser','drama clip','christmas'))return 'Discipleship';
  if(has('speaker','behringer','subwoofer','subs','led','cctv','sound booth','soundbooth','multimedia','projector','microphone','audio','video','camera','amplifier','avr','network switch','tv wire','tv in','cafeteria tv','fun hall tv','computer','laptop','printer','gadget','electronic','wire','wiring','internet','keyboard','monitor','speaker wire'))return 'Multimedia';
  if(has('admin','paperwork','document','record','permit','license','office','filing','payroll','budget','finance','report','meeting','schedule','roster','announce','regist','database','attendance list','minutes'))return 'Admin';
  const dept=String(t.department||'').trim();
  if(dept==='Multimedia')return 'Multimedia';
  if(dept==='Worship'||dept==='Events')return 'Discipleship';
  if(dept==='Administration')return 'Admin';
  return 'Facilities';
}

function sectionTasks(section,pool){
  const list=(pool||[]).filter(t=>sectionFor(t)===section);
  const rank=new Map((Array.isArray(state.priorityOrder)?state.priorityOrder:[]).map((id,index)=>[id,index]));
  return list.sort((a,b)=>{
    const ar=rank.has(a.id)?rank.get(a.id):Number.MAX_SAFE_INTEGER;
    const br=rank.has(b.id)?rank.get(b.id):Number.MAX_SAFE_INTEGER;
    return ar-br||state.tasks.indexOf(a)-state.tasks.indexOf(b);
  });
}
function saveSectionOrder(newIds,sectionName,taskTitle){
  const set=new Set(newIds);
  const stillKnown=new Set(state.tasks.map(t=>t.id));
  const prev=(Array.isArray(state.priorityOrder)?state.priorityOrder:state.tasks.map(t=>t.id)).filter(id=>stillKnown.has(id));
  const firstPos=prev.findIndex(id=>set.has(id));
  const rest=prev.filter(id=>!set.has(id));
  const at=firstPos<0?rest.length:firstPos;
  rest.splice(Math.max(0,Math.min(at,rest.length)),0,...newIds.filter(id=>stillKnown.has(id)));
  state.priorityOrder=rest;
  saveState();
  addActivity('Reordered the '+sectionName+' section'+(taskTitle?' ('+taskTitle+')':'')+'.','activity');
  renderPage();
  showToast('Order saved.');
}
function moveSectionTask(id,delta,section){
  const ids=sectionTasks(section,filteredTasks()).map(t=>t.id);
  const from=ids.indexOf(id),to=from+delta;
  if(from<0||to<0||to>=ids.length)return;
  [ids[from],ids[to]]=[ids[to],ids[from]];
  saveSectionOrder(ids,section,getTask(id)?.title||'');
}
function bindSectionLists(root){
  root.querySelectorAll('[data-section-list]').forEach(list=>{
    const section=list.dataset.sectionList;
    let draggedId=null;
    list.addEventListener('dragstart',e=>{
      const grip=e.target.closest('[data-task-grip]');if(!grip){e.preventDefault();return;}
      draggedId=grip.dataset.taskGrip;
      const row=grip.closest('[data-task-id]');if(row)row.classList.add('priority-is-dragging');
      if(e.dataTransfer){e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',draggedId);}
    });
    list.addEventListener('dragover',e=>{
      if(!draggedId)return;
      const row=e.target.closest('[data-task-id]');if(!row||row.dataset.taskId===draggedId)return;
      e.preventDefault();if(e.dataTransfer)e.dataTransfer.dropEffect='move';
      list.querySelectorAll('.priority-drop-before,.priority-drop-after').forEach(x=>x.classList.remove('priority-drop-before','priority-drop-after'));
      const r=row.getBoundingClientRect();
      row.classList.add(e.clientY>r.top+r.height/2?'priority-drop-after':'priority-drop-before');
    });
    list.addEventListener('drop',e=>{
      const target=e.target.closest('[data-task-id]');if(!draggedId||!target)return;
      e.preventDefault();
      const sourceId=draggedId,targetId=target.dataset.taskId;
      list.querySelectorAll('.priority-is-dragging,.priority-drop-before,.priority-drop-after').forEach(x=>x.classList.remove('priority-is-dragging','priority-drop-before','priority-drop-after'));
      draggedId=null;if(sourceId===targetId)return;
      const ids=sectionTasks(section,filteredTasks()).map(t=>t.id);
      const from=ids.indexOf(sourceId),at=ids.indexOf(targetId);if(from<0||at<0)return;
      const r=target.getBoundingClientRect();
      const after=e.clientY>r.top+r.height/2;
      const [moved]=ids.splice(from,1);
      let insertAt=at+(after?1:0);if(from<insertAt)insertAt--;
      ids.splice(Math.max(0,Math.min(insertAt,ids.length)),0,moved);
      saveSectionOrder(ids,section,getTask(sourceId)?.title||sourceId);
    });
    list.addEventListener('dragend',()=>{draggedId=null;list.querySelectorAll('.priority-is-dragging,.priority-drop-before,.priority-drop-after').forEach(x=>x.classList.remove('priority-is-dragging','priority-drop-before','priority-drop-after'));});
    list.addEventListener('click',e=>{
      const move=e.target.closest('[data-task-move]');
      if(move){e.preventDefault();e.stopPropagation();moveSectionTask(move.dataset.id,move.dataset.taskMove==='up'?-1:1,section);return;}
      if(e.target.closest('[data-task-grip]')){e.stopPropagation();return;}
    },true);
  });
}
function filteredTasks(){let tasks=[...state.tasks];if(taskFilters.status==='all')tasks=tasks.filter(t=>!['Completed','Cancelled'].includes(t.status));if(globalSearch.trim()){const q=globalSearch.trim().toLowerCase();tasks=tasks.filter(t=>[t.title,t.description,t.department,t.location,t.project,t.owner,t.id,(t.tags||[]).join(' ')].join(' ').toLowerCase().includes(q))}if(taskFilters.status!=='all')tasks=tasks.filter(t=>t.status===taskFilters.status);if(taskFilters.department!=='all')tasks=tasks.filter(t=>t.department===taskFilters.department);if(taskFilters.location!=='all')tasks=tasks.filter(t=>t.location===taskFilters.location);if(taskFilters.priority!=='all')tasks=tasks.filter(t=>t.priority===taskFilters.priority);if(projectFilter!=='all')tasks=tasks.filter(t=>t.project===projectFilter);return tasks}

function priorityTasks(){
  const active=state.tasks.filter(t=>!['Completed','Cancelled'].includes(t.status));
  if(!Array.isArray(state.priorityOrder)){
    const weight={High:0,Medium:1,Low:2};
    active.sort((a,b)=>(weight[a.priority]??1)-(weight[b.priority]??1)||state.tasks.indexOf(a)-state.tasks.indexOf(b));
    state.priorityOrder=active.map(t=>t.id);
    saveState();
    return active;
  }
  const rank=new Map(state.priorityOrder.map((id,index)=>[id,index]));
  return active.sort((a,b)=>{
    const ar=rank.has(a.id)?rank.get(a.id):Number.MAX_SAFE_INTEGER;
    const br=rank.has(b.id)?rank.get(b.id):Number.MAX_SAFE_INTEGER;
    return ar-br || state.tasks.indexOf(a)-state.tasks.indexOf(b);
  });
}

function savePriorityOrder(ids,activityText){
  const stillKnown=new Set(state.tasks.map(t=>t.id));
  const previous=Array.isArray(state.priorityOrder)?state.priorityOrder:[];
  state.priorityOrder=ids.filter(id=>stillKnown.has(id)).concat(previous.filter(id=>stillKnown.has(id)&&!ids.includes(id)));
  saveState();
  if(activityText)addActivity(activityText,'activity');
  renderPage();
}

  const tasks=priorityTasks();const ids=tasks.map(t=>t.id);const from=ids.indexOf(id);const to=from+delta;
  if(from<0||to<0||to>=ids.length)return;
  [ids[from],ids[to]]=[ids[to],ids[from]];
  savePriorityOrder(ids,'Reordered the priority list.');
}
function bindPriorityList(root){
  const list=root.querySelector('#priority-sort-list');if(!list)return;
  let draggedId=null;
  list.addEventListener('dragstart',e=>{
    const grip=e.target.closest('[data-priority-grip]');if(!grip){e.preventDefault();return;}
    draggedId=grip.dataset.priorityGrip;
    const row=grip.closest('[data-priority-id]');if(row)row.classList.add('priority-is-dragging');
    if(e.dataTransfer){e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',draggedId);}
  });
  list.addEventListener('dragover',e=>{
    if(!draggedId)return;
    const row=e.target.closest('[data-priority-id]');if(!row||row.dataset.priorityId===draggedId)return;
    e.preventDefault();if(e.dataTransfer)e.dataTransfer.dropEffect='move';
    list.querySelectorAll('.priority-drop-before,.priority-drop-after').forEach(x=>x.classList.remove('priority-drop-before','priority-drop-after'));
    const after=e.clientY>row.getBoundingClientRect().top+row.getBoundingClientRect().height/2;
    row.classList.add(after?'priority-drop-after':'priority-drop-before');
  });
  list.addEventListener('drop',e=>{
    const target=e.target.closest('[data-priority-id]');if(!draggedId||!target)return;
    e.preventDefault();const sourceId=draggedId, targetId=target.dataset.priorityId;
    list.querySelectorAll('.priority-is-dragging,.priority-drop-before,.priority-drop-after').forEach(x=>x.classList.remove('priority-is-dragging','priority-drop-before','priority-drop-after'));
    draggedId=null;if(sourceId===targetId)return;
    const ids=priorityTasks().map(t=>t.id);const from=ids.indexOf(sourceId), at=ids.indexOf(targetId);if(from<0||at<0)return;
    const after=e.clientY>target.getBoundingClientRect().top+target.getBoundingClientRect().height/2;
    const [moved]=ids.splice(from,1);let insertAt=at+(after?1:0);if(from<insertAt)insertAt--;
    ids.splice(Math.max(0,Math.min(insertAt,ids.length)),0,moved);
    savePriorityOrder(ids,'Moved “'+(getTask(sourceId)?.title||sourceId)+'” in the priority list.');
    showToast('Priority order saved.');
  });
  list.addEventListener('dragend',()=>{draggedId=null;list.querySelectorAll('.priority-is-dragging,.priority-drop-before,.priority-drop-after').forEach(x=>x.classList.remove('priority-is-dragging','priority-drop-before','priority-drop-after'));});
  list.addEventListener('click',e=>{
    const move=e.target.closest('[data-priority-move]');if(move){e.preventDefault();e.stopPropagation();movePriorityTask(move.dataset.id,move.dataset.priorityMove==='up'?-1:1);return;}
    const grip=e.target.closest('[data-priority-grip]');if(!grip){const row=e.target.closest('[data-priority-id]');if(row)openTaskDetail(row.dataset.priorityId);}
  });
}

function resetData(){openModal('Reset prototype data?','This replaces this browser’s current data with the original sample records.',`<div class="detail-summary">This cannot be undone unless you have exported a backup. The workbook file itself will not be changed.</div>`,`${btn('Cancel','close-modal','btn')}<button class="btn btn-danger" id="confirm-reset">Reset data</button>`);document.getElementById('confirm-reset').onclick=()=>{state={tasks:deepCopy(seedTasks),projects:deepCopy(seedProjects),ideas:deepCopy(seedIdeas),inbox:[],activity:deepCopy(seedActivity),theme:state.theme,nextTask:118,nextProject:106,nextIdea:105};saveState();closeModal();navigate('dashboard');showToast('Prototype data reset.') }}
function restoreData(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);if(!Array.isArray(x.tasks)||!Array.isArray(x.projects))throw new Error('Invalid');state={...state,...x};saveState();setTheme(state.theme||'dark');navigate('dashboard');showToast('Backup restored.')}catch(e){showToast('That file is not a valid organizer JSON backup.')}};reader.readAsText(file)}
function newTagModal(){const body=`<form id="tag-form"><div class="form-grid">${field('Hashtag','tag','#new','text',{required:true,placeholder:'#mm'})}${field('Meaning','meaning','','text',{required:true,placeholder:'Multimedia'})}${field('Destination','destination','','text',{required:true,placeholder:'Department or workspace'})}<div class="field full"><div class="input-note">In this prototype, the entry is recorded in activity only. Editable persistent hashtag rules will be implemented with the admin settings backend.</div></div></div></form>`;openModal('Suggest a hashtag rule','Add a candidate for the team to confirm.',body,`${btn('Cancel','close-modal','btn')}<button class="btn btn-primary" type="submit" form="tag-form">Save suggestion</button>`);document.getElementById('tag-form').addEventListener('submit',e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target).entries());addActivity(`Suggested hashtag rule ${o.tag} → ${o.meaning} (${o.destination}).`);closeModal();showToast('Hashtag suggestion recorded in activity.');renderPage()})}

document.getElementById('primary-nav').addEventListener('click',e=>{const b=e.target.closest('[data-page]');if(b)navigate(b.dataset.page)});

document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const a=el.dataset.action;const id=el.dataset.id;if(a==='close-modal'){closeModal();return}if(a==='new-task'){taskForm();return}if(a==='edit-task'){taskForm(getTask(id));return}if(a==='task-detail'){openTaskDetail(id);return}if(a==='delete-task-confirm'){confirmDeleteTask(id);return}if(a==='new-project'){projectForm();return}if(a==='edit-project'){const p=state.projects.find(p=>p.id===id);if(p)projectForm(p);return}if(a==='new-idea'){ideaForm();return}if(a==='idea-detail'){ideaDetail(id);return}if(a==='promote-idea'){promoteIdea(id);return}if(a==='upload-notes'){newNoteModal(false);return}if(a==='typed-note'){newNoteModal(true);return}if(a==='inbox-review'){inboxReview(id);return}if(a==='transcribe-note'){const n=state.inbox.find(x=>x.id===id);if(n){closeModal();transcriptionModal(n)}return}if(a==='project-tasks'){viewProjectTasks(id);return}if(a==='location-tasks'){viewLocationTasks(el.dataset.name,el.dataset.kind);return}if(a==='go-tasks'){navigate('tasks');return}if(a==='go-inbox'){navigate('inbox');return}if(a==='go-projects'){navigate('projects');return}if(a==='refresh-priority-list'){if(Array.isArray(state.priorityOrder)){const ordered=priorityTasks().map(t=>t.id);state.priorityOrder=ordered.concat(state.priorityOrder.filter(id=>!ordered.includes(id)));saveState()}renderPage();showToast('Priority list refreshed.');return}if(a==='clear-project'){projectFilter='all';renderPage();return}if(a==='export-data'){exportData();return}if(a==='reset-data'){resetData();return}if(a==='new-tag'){newTagModal();return}if(a==='close-backdrop'&&e.target===el){closeModal();return}});

          // 1600px keeps small handwriting legible while keeping uploads fast and under AI payload limits.
          const scale = Math.min(1,1600 / Math.max(image.width,image.height));
          const canvas = document.createElement('canvas');

      notes.textContent = (aiTranscriptions ? aiTranscriptions + '\n' : '') + aiNotes + (errs.length ? 'Issues: ' + errs.join(' | ') : '');
      renderSuggestions();
      status.textContent = suggestions.length ? 'AI found ' + suggestions.length + ' task suggestion(s). Review and edit before importing.' : (errs.length ? 'Deciphering failed. Read the detailed error above; if it mentions the AI service or binding, the Cloudflare AI connection needs setup.' : 'The AI returned no actionable tasks. Check the transcription above or upload a closer crop.');
      fileInput.disabled=false;run.disabled=!files.length;importBtn.disabled=!suggestions.length;
    });
    function confidenceScore(value){if(typeof value==='number')return value>1?value/100:value;const v=String(value??'').trim().toLowerCase();const n=Number(v.replace('%',''));if(v&&Number.isFinite(n))return n>1?n/100:n;if(v==='high')return .9;if(v==='medium')return .65;if(v==='low')return .4;return 0;}
    function renderSuggestions() {
      if(!suggestions.length){results.innerHTML=noData('No task suggestions','Try a closer photo, or upload one note at a time.');return;}
      const departments=['Facilities','Custodial','Multimedia','Worship','Events','Administration'];
      const needsHuman=suggestions.filter(t=>confidenceScore(t.confidence)<0.8).length;
      results.innerHTML=(needsHuman?`<div class="callout" style="margin-bottom:14px;border-color:var(--warning);background:var(--warning-bg)">${icon('alert',18)}<div><strong>Human verification required · ${needsHuman}</strong><br>These readings are below 80% confidence. They will not receive an automatic person-in-charge assignment. Compare each suggestion with the original note before importing.</div></div>`:'<div class="callout" style="margin-bottom:14px">All readings are at least 80% confidence, but review the transcription before importing.</div>')+suggestions.map((t,i)=>`<div class="panel" data-ai-row="${i}" style="padding:13px;margin-bottom:11px">
        <label style="display:flex;align-items:center;gap:8px;margin-bottom:10px"><input type="checkbox" data-ai-include checked> Include this task</label>
        <div class="form-grid">
          <div class="field full"><label>Task title</label><input class="select" data-ai="title" value="${esc(t.title)}" style="width:100%"></div>
          <div class="field full"><label>Details / transcription</label><textarea class="select" data-ai="description" style="width:100%;height:72px;padding:9px">${esc(t.description || '')}</textarea></div>
          <div class="field"><label>Department</label><select class="select" data-ai="department" style="width:100%">${departments.map(d=>`<option${d===(t.department||'Facilities')?' selected':''}>${d}</option>`).join('')}</select></div>
          <div class="field"><label>Location</label><input class="select" data-ai="location" value="${esc(t.location||'Unknown')}" style="width:100%"></div>
          <div class="field full"><label>Person in charge</label><input class="select" data-ai="person" list="ai-capture-people" value="${esc(confidenceScore(t.confidence)>=0.8?(t.personInCharge||'Unassigned'):'Unassigned')}" style="width:100%" ${confidenceScore(t.confidence)<0.8?'disabled':''}><div class="input-note">${confidenceScore(t.confidence)<0.8?'Locked to Unassigned because confidence is below 80%. Verify the note first.':'Confirm the person before importing.'}</div></div>
          <div class="field"><label>Priority</label><select class="select" data-ai="priority" style="width:100%">${['High','Medium','Low'].map(p=>`<option${p===(t.priority||'Medium')?' selected':''}>${p}</option>`).join('')}</select></div>
          <div class="field"><label>Reading confidence</label><div class="input-note" style="padding:9px 0">${Math.round(confidenceScore(t.confidence)*100)}% · ${confidenceScore(t.confidence)<0.8?'Human verification required':'Review before import'}</div></div>
        </div><div class="source-note">Image: ${esc(t.sourceFile||'uploaded note')}</div></div>`).join('');
    }
    importBtn.addEventListener('click',() => {
      const cards = Array.from(results.querySelectorAll('[data-ai-row]'));
      const newTasks = [];
      cards.forEach(card => {
        if(!card.querySelector('[data-ai-include]').checked) return;
        const value = k => card.querySelector('[data-ai="'+k+'"]').value.trim();
        const title = value('title'); if(!title) return;
        const s = suggestions[Number(card.dataset.aiRow)] || {};
        newTasks.push({id:'T-'+state.nextTask++,title,description:value('description'),department:value('department')||'Facilities',location:value('location')||'Unknown',project:'',status:'Needs review',priority:value('priority')||'Medium',owner:confidenceScore(s.confidence)>=0.8?(value('person')||'Unassigned'):'Unassigned',dueDate:'',type:s.type==='Task'?'Task':'Maintenance',tags:Array.isArray(s.tags)&&s.tags.length?s.tags:['#fac'],source:'AI image decipher · '+(s.sourceFile||'uploaded note'),updated:'Created from AI Task Capture',notes:'AI reading confidence: '+Math.round(confidenceScore(s.confidence)*100)+'%. '+(confidenceScore(s.confidence)<0.8?'HUMAN VERIFICATION REQUIRED. Assignment intentionally left Unassigned. ':'Verify the transcription against the original note. ')});
      });
      if(!newTasks.length){status.textContent='Select at least one task with a title.';return;}
      const patterns=JSON.parse(localStorage.getItem('steward-pastor-patterns-v1')||'[]');
      cards.forEach(card=>{if(!card.querySelector('[data-ai-include]').checked)return;const value=k=>card.querySelector('[data-ai="'+k+'"]').value.trim();const s0=suggestions[Number(card.dataset.aiRow)]||{};const title=value('title');if(!title)return;patterns.unshift({sourceText:String(s0.description||s0.title||''),correctedTitle:title,department:value('department')||'Facilities',person:confidenceScore(s0.confidence)>=0.8?(value('person')||'Unassigned'):'Unassigned',tags:Array.isArray(s0.tags)?s0.tags:[],confidence:confidenceScore(s0.confidence),verifiedByHuman:true,updatedAt:new Date().toISOString()});});
      localStorage.setItem('steward-pastor-patterns-v1',JSON.stringify(patterns.slice(0,250)));
      state.tasks.unshift(...newTasks);
      addActivity('Created '+newTasks.length+' task(s) from AI image capture and saved human corrections as local examples.','check-square');
      saveState();updateNavCounts();showToast('Added '+newTasks.length+' task(s) for review.');navigate('tasks');
    });
  }
renderPage();
})();
</script>
